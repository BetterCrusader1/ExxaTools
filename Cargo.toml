[package]
name = "exxa"
version = "0.3.0"
edition = "2021"
description = "Steam depots and manifests for the Linux client, on Vapor Forge"
license = "MIT"

[dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_38"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
keyvalues-parser = "0.2"
steamlocate = "2"
ureq = "3"
tungstenite = "0.30"
notify = "8"
tar = "0.4"
flate2 = "1"


[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"