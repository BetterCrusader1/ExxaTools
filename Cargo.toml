[package]
name = "exxa"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "Steam depots and manifests for the Linux client, on Vapor Forge"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
keyvalues-parser = "0.2"
steamlocate = "2"
ureq = "3"
tungstenite = "0.30"
notify = "8"
tar = "0.4"
flate2 = "1"
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"] }


[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"

# Dependencies do not need debuginfo: it is the bulk of target/debug and is
# useless for crates we never step into.
[profile.dev.package."*"]
debug = false
