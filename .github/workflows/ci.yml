name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the window
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - run: node --check assets/steam-menu.js
      - run: node --check examples/plugins/hello/frontend.js
      - run: python3 scripts/docs-check.py
      - run: ./target/release/exxa selftest
